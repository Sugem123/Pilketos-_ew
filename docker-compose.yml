services:
  pilketos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pilketos-app
    restart: unless-stopped
    environment:
      APP_NAME: "Pilketos"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "http://localhost:8099"
      LOG_CHANNEL: stderr
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      APP_TIMEZONE: "Asia/Jakarta"
      TZ: "Asia/Jakarta"
      RUN_MIGRATIONS: "true"
      RUN_SEEDERS: "true"
    volumes:
      - pilketos-db:/var/www/html/database
      - pilketos-storage:/var/www/html/storage/app
      - pilketos-config:/var/www/html/config-data
    networks:
      - coolify
    ports:
      - "8099:80"

volumes:
  pilketos-db:
  pilketos-storage:
  pilketos-config:

networks:
  coolify:
    external: true
